
services:
  # ─────────────────────────────────────────────────────────────────
  # PostgreSQL Database — all data stored locally in a named volume
  # ─────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: calori_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calori}
      POSTGRES_USER: ${POSTGRES_USER:-calori}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calori_secret}
    volumes:
      - calori_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calori} -d ${POSTGRES_DB:-calori}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────
  # Redis Cache — stores API results for offline use
  # ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: calori_redis
    restart: unless-stopped
    volumes:
      - calori_redis_data:/data
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: calori_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-calori}:${POSTGRES_PASSWORD:-calori_secret}@db:5432/${POSTGRES_DB:-calori}
      REDIS_URL: redis://redis:6379
      USDA_API_KEY: ${USDA_API_KEY:-DEMO_KEY}
      OPEN_FOOD_FACTS_URL: https://world.openfoodfacts.org
      USDA_BASE_URL: https://api.nal.usda.gov/fdc/v1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────
  # React Frontend (Vite dev server)
  # ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: calori_frontend
    restart: unless-stopped
    ports:
      - "3000:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://backend:8000

# ─────────────────────────────────────────────────────────────────
# Named Volumes — data persists on your MacBook's local disk
# ─────────────────────────────────────────────────────────────────
volumes:
  calori_db_data:
    driver: local
  calori_redis_data:
    driver: local
